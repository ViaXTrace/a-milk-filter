name: a_milk_filter
description: >
  A Milk Filter — Transform your photos into the aesthetic of the unseen.
  Inspired by the visual language of Milk Outside a Bag of Milk.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  image: ^4.1.7
  image_picker: ^1.0.7
  path_provider: ^2.1.2
  share_plus: ^7.2.2
  gal: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
