name: Build & Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.2.0)'
        required: true
        default: '1.0.0'
      release_notes:
        description: 'Release notes (shown in GitHub Release body)'
        required: false
        default: 'New release of A Milk Filter.'
      prerelease:
        description: 'Mark as pre-release?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Print Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Unit tests
        run: flutter test --reporter=expanded

      - name: Build split release APKs (arm64-v8a · armeabi-v7a · x86_64)
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs with version + arch suffix
        run: |
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do
            arch=$(echo "$f" | sed 's/app-\(.*\)-release\.apk/\1/')
            mv "$f" "a-milk-filter-v${{ github.event.inputs.version }}-${arch}.apk"
          done
          echo "── Built APKs ──"
          ls -lh *.apk

      - name: Upload APKs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: apks-v${{ github.event.inputs.version }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 90
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: "A Milk Filter v${{ github.event.inputs.version }}"
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          files: build/app/outputs/flutter-apk/*.apk
          body: |
            ## A Milk Filter v${{ github.event.inputs.version }}

            ${{ github.event.inputs.release_notes }}

            ---

            ### Download

            Pick the APK that matches your device:

            | File | Architecture | Devices |
            |---|---|---|
            | `a-milk-filter-v${{ github.event.inputs.version }}-arm64-v8a.apk` | ARM 64-bit | All modern Android phones (recommended) |
            | `a-milk-filter-v${{ github.event.inputs.version }}-armeabi-v7a.apk` | ARM 32-bit | Older devices |
            | `a-milk-filter-v${{ github.event.inputs.version }}-x86_64.apk` | x86 64-bit | Emulators |

            ---

            ### Install

            1. Download the APK for your architecture
            2. On your Android device: **Settings → Security → Install unknown apps** → allow your browser/file manager
            3. Open the downloaded APK and tap **Install**

            ---

            ### What's inside

            - Milk I palette: void · crimson · mauve
            - Milk II palette: void · rust · blood
            - Pointillism mode (stochastic dithering at band boundaries)
            - JPEG compression pre-pass (DCT artifacts + palette quantization)
            - Draggable before/after split-screen comparison
            - Save to gallery · Share via system sheet

            ---
            *Built with Flutter stable · Android minSdk 21 · Inspired by "Milk Outside a Bag of Milk Outside a Bag of Milk"*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
